name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy, soft fail)
        run: uv run mypy src || true

      - name: Test with coverage
        run: uv run pytest --cov

      - name: Enforce coverage threshold
        run: uv run coverage report

      # 审计读冻结的 lock（与 Dependabot 同源）。
      # --disable-pip --no-deps 避开 pip-audit 临时 venv 在 uv 托管解释器上的 SIGABRT。
      # 例外只能按公告 ID 忽略，且必须在下面注释里写明原因与影响面。
      - name: Audit dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off
