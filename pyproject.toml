[project]
name = "checkin-windalice"
version = "0.1.0"
description = "Daily check-in automation for Wind Alice (每日签到)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
checkin-windalice = "checkin_windalice.cli:console_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkin_windalice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/checkin_windalice"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
